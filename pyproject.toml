[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-wakeword"
dynamic = ["version"]
description = "Train your own wake words for Home Assistant Voice (microWakeWord) from household recordings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "PyYAML>=6.0",
    "elevenlabs>=2.0",  # optional ElevenLabs takes of the word (panel: card 1 → ElevenLabs)
]

[project.optional-dependencies]
evaluate = ["pymicro-features>=2.0", "ai-edge-litert>=1.0"]
test = ["pytest>=8"]
docs = ["playwright>=1.45", "mkdocs==1.6.1", "mkdocs-material==9.8.1", "mkdocs-static-i18n==1.3.1"]  # screenshots (installed Google Chrome), the documentation site

[project.scripts]
wakeword = "wakeword.cli:main"

[tool.setuptools.dynamic]
version = { attr = "wakeword.__version__" }

[tool.setuptools.packages.find]
include = ["wakeword*"]

[tool.setuptools.package-data]
"wakeword.recorder" = ["static/*"]
"wakeword.studio" = ["www/*", "www/views/*", "www/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: builds and runs Docker images (make test-docker; make test leaves them out)"]
